spring.application.name=MyTasksWebApp
server.port=8080

# Banco de dados (o banco mytasksweb é criado sozinho se não existir)
spring.datasource.url=jdbc:mysql://localhost:3306/mytasksweb?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

# Executa o schema.sql (cria as tabelas na primeira vez)
spring.sql.init.mode=always
