<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyTasks - Login</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header><strong>MyTasks</strong></header>
    <div class="caixa">
        <h1>Entrar</h1>
        <p class="aviso" id="mensagemErro"></p>
        <form id="formLogin" novalidate>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seuemail@exemplo.com">
                <span class="erro"></span>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha">
                <span class="erro"></span>
            </div>
            <button type="submit" class="btn cheio">Entrar</button>
        </form>
        <p class="link">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
    <script src="js/api.js"></script>
    <script src="js/validacao.js"></script>
</body>
</html>
